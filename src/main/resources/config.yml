# ---------------------------------------------------------------------------
# RemoteChests
# ---------------------------------------------------------------------------

settings:
  # Quantos baus cada jogador pode registrar. Use -1 para ilimitado.
  # A permissao "remotechests.unlimited" ignora este limite.
  max-chests-per-player: 20

  # Distancia maxima (em blocos) para mirar em um bau com /bau set.
  set-distance: 6

  # Permite abrir um bau que esta em outro mundo/dimensao.
  allow-cross-world: true

  # Segundos de espera entre duas aberturas remotas. 0 desativa.
  open-cooldown-seconds: 2

  # Toca o som de abrir/fechar e anima a tampa no bau real,
  # para que quem estiver por perto perceba o acesso.
  animate-real-block: true

  # Impede que outros jogadores quebrem um bau registrado.
  # O dono continua podendo quebrar (o registro e removido automaticamente).
  protect-registered-blocks: true

  # Impede que explosoes destruam baus registrados.
  protect-from-explosions: true

  # Remove o registro automaticamente quando o bloco nao existe mais.
  auto-remove-missing: false

  # Tipos de bloco que podem ser registrados.
  allowed-containers:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - SHULKER_BOX
    - WHITE_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - YELLOW_SHULKER_BOX
    - LIME_SHULKER_BOX
    - PINK_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - RED_SHULKER_BOX
    - BLACK_SHULKER_BOX

